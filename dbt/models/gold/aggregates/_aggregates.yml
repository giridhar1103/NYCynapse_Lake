version: 2
models:
  - name: agg_trips_zone_hourly
    description: >
      Taxi and app trips per pickup zone per local hour, by service, since January 2024. Built
      from plausible trips only. Measures are sums and counts so they can be added across rows;
      for an average divide a sum by its count, for example wait_minutes_sum / trips_with_wait.
    meta: {domain: rideshare_taxi, grain: one row per service per zone per local hour,
           local_date_column: pickup_date, partition_column: file_month}
    columns:
      - {name: file_month, description: "Month of the TLC files."}
      - name: service
        description: uber, lyft, via, juno, yellow or green.
        data_tests: [not_null]
      - {name: pickup_date, description: "Pickup date in New York."}
      - {name: pickup_hour, description: "Pickup hour in New York."}
      - {name: pickup_zone_id, description: "Pickup taxi zone."}
      - {name: trips, description: "Trips."}
      - {name: trip_miles_sum, description: "Total miles."}
      - {name: trip_minutes_sum, description: "Total minutes."}
      - {name: wait_minutes_sum, description: "Total rider wait, app trips only."}
      - {name: trips_with_wait, description: "Trips with a known wait. Divide wait_minutes_sum by this."}
      - {name: fare_usd_sum, description: "Total paid by riders before tips. For taxis, total minus tip."}
      - {name: tips_usd_sum, description: "Total tips. Taxi cash tips are not recorded."}
      - {name: driver_pay_usd_sum, description: "Total driver pay, app trips only."}
      - {name: cbd_congestion_fee_usd_sum, description: "Total congestion relief zone tolls."}
      - {name: trips_charged_cbd_fee, description: "Trips that paid the congestion relief zone toll."}
  - name: agg_trip_times_zone_pair
    description: >
      Typical car trip times and fares between two taxi zones, by ride kind (taxi or app),
      weekday or weekend and local pickup hour, from the last three months of plausible taxi and
      app trips. Minutes and fares
      are read from 2 minute and 2 dollar buckets, so they are accurate to about a minute or a
      dollar. Pairs with fewer than 8 trips in an hour are left out.
    meta: {domain: rideshare_taxi, grain: one row per ride kind, pickup zone, dropoff zone, day type and hour}
    columns:
      - name: ride_kind
        description: taxi (yellow and green) or app (Uber, Lyft and other high-volume services).
        data_tests: [not_null]
      - {name: pickup_zone_id, description: "Pickup taxi zone."}
      - {name: dropoff_zone_id, description: "Dropoff taxi zone."}
      - name: day_type
        description: weekday or weekend.
        data_tests: [not_null]
      - {name: pickup_hour, description: "Pickup hour in New York."}
      - {name: trips, description: "Trips behind the figures."}
      - {name: minutes_p25, description: "A quick trip: a quarter of trips were faster."}
      - {name: minutes_median, description: "Typical trip time in minutes."}
      - {name: minutes_p75, description: "A slow trip: a quarter of trips were slower."}
      - {name: fare_usd_median, description: "Typical amount paid before tip, tolls and fees included."}
      - {name: since_month, description: "First month of trips used."}
