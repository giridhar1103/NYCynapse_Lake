  - name: fct_bike_station_status
    description: >
      Bikes and docks at each Citi Bike station, one row each time they changed, since capture
      began in October 2026. A row holds until the next row for the same station.
    meta: {domain: bike, grain: one row per station per change, time_column: reported_at}
    columns:
      - {name: station_id, description: "Station. Joins to dim_bike_station."}
      - {name: reported_at, description: "When the station reported. Filter time ranges on this column."}
      - {name: reported_at_local, description: "Report time in New York."}
      - {name: reported_date, description: "Report date."}
      - {name: reported_hour, description: "Report hour."}
      - {name: bikes_available, description: "Bikes ready to rent."}
      - {name: ebikes_available, description: "Electric bikes ready to rent, included in bikes_available."}
      - {name: classic_bikes_available, description: "Classic bikes ready to rent."}
      - {name: docks_available, description: "Empty docks."}
      - {name: bikes_disabled, description: "Broken or reserved bikes in docks."}
      - {name: docks_disabled, description: "Docks out of service."}
      - {name: is_installed, description: "Station physically in place."}
      - {name: is_renting, description: "Renting bikes."}
      - {name: is_returning, description: "Accepting returns."}
      - {name: is_empty, description: "No bikes to rent while renting."}
      - {name: is_full, description: "No docks free while accepting returns."}

  - name: fct_traffic_speed
    description: Speed readings on DOT sensor links, about one per link every five minutes, since January 2024.
    meta: {domain: traffic, grain: one row per link per reading, time_column: observed_at,
           local_date_column: observed_date}
    columns:
      - {name: link_id, description: "Road link. Joins to dim_traffic_link."}
      - {name: observed_at, description: "Reading instant. Filter time ranges on this column."}
      - {name: observed_at_local, description: "Reading time in New York."}
      - {name: observed_date, description: "Reading date."}
      - {name: observed_hour, description: "Reading hour."}
      - {name: speed_mph, description: "Average speed over the link, miles per hour."}
      - {name: travel_time_seconds, description: "Seconds to drive the link."}
      - {name: status_code, description: "DOT status code. 0 is a normal reading."}
      - {name: is_valid, description: "True for normal readings. Use only these for speed averages."}
