source: citibike_live
version: 1
domain: bike
description: >
  Citi Bike's live station feeds (GBFS 2.3), read every minute. A status row is stored only when
  a station's counts or flags change, so each row holds from its reported_at until the next row
  for the same station. Capture began in October 2026; periods the poller missed are listed in
  ops.feed_gaps. The feed also covers Jersey City and Hoboken.
cadence: every minute
freshness_sla: 10 minutes
upstream:
  - https://gbfs.lyft.com/gbfs/2.3/bkn/en/station_status.json
  - https://gbfs.lyft.com/gbfs/2.3/bkn/en/station_information.json

tables:
  - name: bike_station_status
    description: Bikes and docks at a station, recorded each time they change.
    grain: one row per station per change
    primary_key: [station_id, reported_at]
    write: append_new
    event_time: reported_at
    partition_by: [year(reported_at), month(reported_at)]
    columns:
      - {name: station_id, type: VARCHAR, nullable: false, description: Station id. Joins to bike_station.}
      - {name: reported_at, type: TIMESTAMPTZ, nullable: false, description: When the station reported these values.}
      - {name: bikes_available, type: SMALLINT, nullable: false, min: 0, unit: bikes, description: Bikes ready to rent, classic and electric.}
      - {name: ebikes_available, type: SMALLINT, min: 0, unit: bikes, description: Electric bikes ready to rent, included in bikes_available.}
      - {name: bikes_disabled, type: SMALLINT, min: 0, unit: bikes, description: Broken or reserved bikes sitting in docks.}
      - {name: docks_available, type: SMALLINT, nullable: false, min: 0, unit: docks, description: Empty docks a bike can be returned to.}
      - {name: docks_disabled, type: SMALLINT, min: 0, unit: docks, description: Docks out of service.}
      - {name: is_installed, type: BOOLEAN, nullable: false, description: The station is physically in place.}
      - {name: is_renting, type: BOOLEAN, nullable: false, description: Bikes can be rented here.}
      - {name: is_returning, type: BOOLEAN, nullable: false, description: Bikes can be returned here.}
      - {name: polled_at, type: TIMESTAMPTZ, nullable: false, description: When the poller read the change.}

  - name: bike_station
    description: Citi Bike stations as last seen in the live feed.
    grain: one row per station
    primary_key: [station_id]
    write: merge
    columns:
      - {name: station_id, type: VARCHAR, nullable: false, description: Station id used by the live feeds.}
      - {name: short_name, type: VARCHAR, description: "Station number, for example 8775.03. Trip history uses this as the station id."}
      - {name: name, type: VARCHAR, nullable: false, description: "Station name, usually two cross streets, for example Hull Ave & E 209 St."}
      - {name: latitude, type: DOUBLE, nullable: false, description: Latitude.}
      - {name: longitude, type: DOUBLE, nullable: false, description: Longitude.}
      - {name: capacity, type: SMALLINT, min: 0, unit: docks, description: Number of docks.}
      - {name: region, type: VARCHAR, description: "Operating area, for example NYC District, Bronx, JC District, Hoboken District."}
      - {name: has_charging, type: BOOLEAN, description: The station charges electric bikes.}
      - {name: first_seen_at, type: TIMESTAMPTZ, nullable: false, description: First time the poller saw the station.}
      - {name: last_seen_at, type: TIMESTAMPTZ, nullable: false, description: Latest time the poller saw it. Stations removed from the system stop updating.}
      - {name: boro_code, type: TINYINT, description: Borough the station is in. Empty in New Jersey.}
      - {name: nta_code, type: VARCHAR, description: Neighborhood Tabulation Area.}
      - {name: community_district, type: SMALLINT, description: Community district.}
      - {name: modzcta, type: VARCHAR, description: ZIP area.}
      - {name: council_district, type: TINYINT, description: Council district.}
      - {name: police_precinct, type: SMALLINT, description: Police precinct.}
      - {name: taxi_zone_id, type: SMALLINT, description: TLC taxi zone.}
