name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyc_lake
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nycynapse_lake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyc_lake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NYC_LAKE_TEST_PG_DSN: dbname=nycynapse_lake_test host=127.0.0.1 user=nyc_lake password=ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: dbt parse
        working-directory: dbt
        env:
          NYC_LAKE_PG_DSN: dbname=x host=127.0.0.1 user=x password=x
          DBT_PROFILES_DIR: .
        run: |
          python -m venv /tmp/dbt
          /tmp/dbt/bin/pip install -q "dbt-duckdb>=1.9"
          /tmp/dbt/bin/dbt parse
